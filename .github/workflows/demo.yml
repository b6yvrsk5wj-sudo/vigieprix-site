name: Releve en direct

on:
  schedule:
    # 4 fois par jour : la page affiche toujours un releve recent
    - cron: '0 6,11,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerer la page de demonstration
        run: node demo.mjs

      - name: Publier si les prix ont bouge
        run: |
          git config user.name "vigieprix"
          git config user.email "vigieprix@users.noreply.github.com"
          git add demo.html
          git diff --staged --quiet || git commit -m "releve du $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
